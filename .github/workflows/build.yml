name: Build
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Gradle build and unit tests (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run unit tests and build all modules
        run: gradle --no-daemon clean test build
      - name: Upload plugin JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pmf-plugin
          path: pmf-plugin/build/libs/pmf-plugin-*.jar
          if-no-files-found: error

  paper-smoke-test:
    name: Paper 1.21.8 server smoke test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: pmf-plugin
          path: plugin
      - name: Download Paper 1.21.8
        run: |
          BUILD="$(curl -fsSL https://api.papermc.io/v2/projects/paper/versions/1.21.8 | jq -r '.builds[-1]')"
          test -n "$BUILD" && test "$BUILD" != "null"
          curl -fL --retry 3 -o paper.jar "https://api.papermc.io/v2/projects/paper/versions/1.21.8/builds/$BUILD/downloads/paper-1.21.8-$BUILD.jar"
      - name: Boot Paper and verify PMF startup plus SQLite
        run: |
          mkdir -p server/plugins
          cp plugin/pmf-plugin-*.jar server/plugins/PMF.jar
          cp paper.jar server/paper.jar
          printf 'eula=true\\n' > server/eula.txt
          cd server
          java -Xms1G -Xmx1G -jar paper.jar --nogui > server.log 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
          }
          trap cleanup EXIT
          for i in $(seq 1 120); do
            if grep -q 'Done (' server.log; then break; fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat server.log
              exit 1
            fi
            sleep 1
          done
          grep -q 'Done (' server.log || { cat server.log; echo 'Paper did not finish startup'; exit 1; }
          grep -q 'PMF enabled' server.log || { cat server.log; echo 'PMF did not enable'; exit 1; }
          test -s plugins/PMF/pmf.db || { cat server.log; echo 'PMF SQLite database was not created'; exit 1; }
          echo 'Paper 1.21.8 booted; PMF enabled and SQLite database created.'
